<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Askima Ozel Oyun</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background: #000;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        /* Intro Popup Styling */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s;
        }

        #intro-popup {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #ff3366;
            border-radius: 25px;
            padding: 40px;
            max-width: 450px;
            width: 85%;
            text-align: center;
            color: white;
            font-family: 'Georgia', serif;
            box-shadow: 0 0 40px rgba(255, 51, 102, 0.4);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #intro-popup h1 {
            font-size: 24px;
            color: #ff3366;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
        }

        #intro-popup p {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }

        #start-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255, 51, 102, 0.4);
        }

        #start-btn:hover {
            transform: scale(1.08);
            background: #ff5c8a;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.7);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div id="intro-overlay">
        <div id="intro-popup">
            <h1>Senin için özel olarak hazırlanmış oyuna hoş geldin sevgilim</h1>
            <p>
                Ortada parlayan büyük bir kalp var. Sapanı geri çekerek oku fırlatmalı ve kalbimi tam 12'den
                vurmalısın.<br><br>
                <b>Nasıl Oynanır?</b><br>
                1. Sapanı geri çek ve nişan al.<br>
                2. Sabırlı ol, ve sonunda kalbimin tam ortasından vur! Her zaman yaptığın gibi :) <br>
            </p>
            <button id="start-btn">Hemen Başla</button>
        </div>
    </div>

    <canvas id="heart"></canvas>
    <canvas id="ui"></canvas>

    <script src="script.js"></script>
</body>

</html>
